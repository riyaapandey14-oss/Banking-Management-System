<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Users - Banking System</title>

    <link rel="stylesheet" href="style.css">

    <script src="app.js" defer></script>

</head>

<body>

    <header>

        <h1>Banking System</h1>

        <p>User Management</p>

    </header>


    <nav>

        <a href="index.html">Dashboard</a>

        <a href="users.html">Users</a>

        <a href="accounts.html">Accounts</a>

        <a href="transactions.html">Transactions</a>

    </nav>


    <main>

        <div class="page-header">

            <h2>Users</h2>

            <button
                class="add-button"
                onclick="showUserForm()">

                + Add User

            </button>

        </div>


        <div
            id="userForm"
            class="form-container">

            <h3 id="userFormTitle">
                Add New User
            </h3>


            <form onsubmit="saveUser(event)">

                <input
                    type="hidden"
                    id="editUserId">


                <label>Name</label>

                <input
                    type="text"
                    id="userName"
                    placeholder="Enter name"
                    required>


                <label>Email</label>

                <input
                    type="email"
                    id="userEmail"
                    placeholder="Enter email"
                    required>


                <label>Phone</label>

                <input
                    type="text"
                    id="userPhone"
                    placeholder="Enter phone number"
                    required>


                <button
                    type="submit"
                    class="save-button">

                    Save User

                </button>


                <button
                    type="button"
                    class="cancel-button"
                    onclick="hideUserForm()">

                    Cancel

                </button>

            </form>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Phone</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="usersTableBody">

                </tbody>

            </table>

        </div>

    </main>


    <footer>

        <p>Banking Management System</p>

    </footer>

</body>

</html>
