<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts - Banking System</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

<header>
    <h1>Banking System</h1>
    <p>Account Management</p>
</header>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="users.html">Users</a>
    <a href="accounts.html">Accounts</a>
    <a href="transactions.html">Transactions</a>
</nav>

<main>

    <div class="page-header">
        <h2>Accounts</h2>
    </div>

    <div class="operations-container">

        <h3>Banking Operations</h3>

        <label>Account ID</label>
        <input type="number" id="operationAccountId" placeholder="Enter account ID">

        <label>Amount</label>
        <input type="number" id="operationAmount" placeholder="Enter amount">

        <div class="operation-buttons">

            <button class="save-button" onclick="depositMoney()">
                Deposit
            </button>

            <button class="edit-button" onclick="withdrawMoney()">
                Withdraw
            </button>

            <button class="add-button" onclick="checkBalance()">
                Check Balance
            </button>

        </div>

    </div>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>User ID</th>
                    <th>Account Number</th>
                    <th>Account Type</th>
                    <th>Balance</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="accountsTableBody"></tbody>

        </table>

    </div>

</main>

<footer>
    <p>Banking Management System</p>
</footer>

</body>
</html>
